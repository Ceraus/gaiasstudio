<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" />
    <title>Clearplan Command — Offline</title>
    <style>
      :root {
        color: #172033;
        background: #f5f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 520px);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 24px;
        background: #ffffff;
        padding: clamp(24px, 7vw, 40px);
        box-shadow: 0 18px 55px rgba(31, 41, 55, 0.12);
      }

      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border-radius: 18px;
        background: #0a0f1c;
        color: #ffffff;
        font-weight: 900;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(1.8rem, 7vw, 2.5rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #64748b;
        line-height: 1.6;
      }

      button {
        min-height: 44px;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #2563eb;
        color: #ffffff;
        padding: 0 20px;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">CP</div>
      <h1>You are offline.</h1>
      <p>Clearplan Command will reconnect automatically when network access returns. Recently cached app screens remain available from the installed app.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
